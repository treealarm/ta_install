# Builds the Windows installer (windows/installer: the WiX bundle ta_vms-setup-x64.exe and the MSI
# inside it, ta_vms-x64.msi) and proves it on clean runners: a silent install, the stack answering
# through its sidecars, an uninstall; and, beside it, an upgrade over the latest release.
#
# Its input is the ta_vms Windows build, the asset ta_vms-windows-x64.zip of the windows-build
# prerelease in treealarm/ta_vms, which every push to ta_vms master replaces -- the way the compose
# stack here runs whatever Docker Hub's :latest is. A new ta_vms build does not trigger this
# workflow: run it by hand (Actions page, or `gh workflow run windows-installer.yml`).
#
# A vX.Y.Z tag also publishes the GitHub release of that version: this installer, once it has
# passed the checks below, and the compose stack as a zip. The compose files in the zip are frozen at
# the version, the images they run are not: Docker Hub's :latest, as everywhere else here.

name: windows-installer

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters do not apply to tag pushes
    paths:
      - windows/**
      - .env
      - init_files/config/mediamtx.yml
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TA_VMS_REPO: treealarm/ta_vms
  TA_VMS_RELEASE: windows-build
  TA_VMS_ASSET: ta_vms-windows-x64.zip
  MT_ADMIN_REPO: treealarm/multitenant_admin
  MT_ADMIN_ASSET: mt_admin-windows-x64.zip
  GH_TOKEN: ${{ github.token }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      ta_vms_commit: ${{ steps.download.outputs.commit }}
      mt_admin_commit: ${{ steps.download.outputs.mt_admin_commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test TaVmsHost
        run: dotnet test windows/TaVmsHost.Tests -c Release --nologo

      - name: Download the ta_vms build
        id: download
        run: |
          gh release download $env:TA_VMS_RELEASE --repo $env:TA_VMS_REPO --pattern $env:TA_VMS_ASSET --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "cannot download $env:TA_VMS_ASSET from $env:TA_VMS_REPO" }
          $notes = gh release view $env:TA_VMS_RELEASE --repo $env:TA_VMS_REPO --json body -q .body
          $notes
          if (-not ("$notes" -match '\b[0-9a-f]{40}\b')) { throw "no commit in the notes of $env:TA_VMS_RELEASE" }
          "commit=$($Matches[0])" >> $env:GITHUB_OUTPUT

          gh release download windows-build --repo $env:MT_ADMIN_REPO --pattern $env:MT_ADMIN_ASSET --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "cannot download $env:MT_ADMIN_ASSET from $env:MT_ADMIN_REPO" }
          $notes = gh release view windows-build --repo $env:MT_ADMIN_REPO --json body -q .body
          if (-not ("$notes" -match '\b[0-9a-f]{40}\b')) { throw "no commit in the notes of $env:MT_ADMIN_REPO windows-build" }
          "mt_admin_commit=$($Matches[0])" >> $env:GITHUB_OUTPUT

      # Third-party downloads are keyed by versions.json: they change only when it does.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/downloads
          key: windows-deps-${{ hashFiles('windows/versions.json') }}

      - name: Stage
        run: |
          .\windows\scripts\Build-Stage.ps1 `
            -TaVmsZip (Join-Path $env:RUNNER_TEMP $env:TA_VMS_ASSET) `
            -MtAdminZip (Join-Path $env:RUNNER_TEMP $env:MT_ADMIN_ASSET) `
            -Stage (Join-Path $env:RUNNER_TEMP 'stage') `
            -Cache (Join-Path $env:RUNNER_TEMP 'downloads')

      # A CI build is numbered after the latest release, so that it upgrades that one: MSI compares
      # three fields only and refuses a downgrade.
      - name: Build setup.exe
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$env:GITHUB_REF_NAME' is not vX.Y.Z" }
          } else {
            $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
            if ($LASTEXITCODE -ne 0 -or $latest -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "no vX.Y.Z release to number this build after ($latest)" }
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          }
          "version $version"
          dotnet build windows\installer\Bundle\Bundle.wixproj -c Release --nologo `
            "-p:StageDir=$env:RUNNER_TEMP\stage" "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'the WiX build failed' }
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out"
          foreach ($name in 'ta_vms-setup-x64.exe', 'ta_vms-x64.msi') {
            $built = Get-ChildItem windows\installer -Recurse -Filter $name | Where-Object FullName -match '\\bin\\' | Select-Object -First 1
            if (-not $built) { throw "the WiX build produced no $name" }
            Copy-Item $built.FullName $out
          }
          Get-ChildItem $out | Format-Table Name, Length

      # Waits for setup.exe itself, not with -Wait: in PowerShell 7 that waits for every descendant,
      # and installing RabbitMQ leaves epmd.exe running for good.
      - name: Install
        timeout-minutes: 20
        run: |
          $setup = Start-Process "$env:RUNNER_TEMP\out\ta_vms-setup-x64.exe" -PassThru `
            -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\setup.log"
          $null = $setup.Handle # keeps the exit code readable after the process is gone
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          Get-Service TaVmsHost, TaVms.Postgres, TaVms.RabbitMQ | Format-Table Name, Status, StartType
          # One entry in Apps and Features, the bundle's: the MSI and the runtimes it chained are
          # its packages, not products of their own to the user.
          $entries = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'TreeAlarm VMS' -and -not $_.SystemComponent })
          if ($entries.Count -ne 1) { throw "$($entries.Count) visible 'TreeAlarm VMS' entries in Apps and Features, not 1" }
          "ok   Apps and Features: TreeAlarm VMS $($entries[0].DisplayVersion)"

      # Each of these goes browser -> web_srv -> its sidecar -> another app's sidecar -> the app
      # (-> PostgreSQL), so a 200 means name resolution, the components and the databases all work.
      # They need a login first, which proves Keycloak came up with its realm: the initial
      # admin/admin, then a password change, as a person may do on the first visit.
      - name: Smoke test
        timeout-minutes: 10
        run: |
          $hostExe = 'C:\Program Files\TreeAlarm VMS\host\TaVmsHost.exe'
          $base = "http://localhost:$(& $hostExe env WEB_VMS_PORT)"
          $deadline = (Get-Date).AddMinutes(5)

          $token = $null
          while (-not $token -and (Get-Date) -lt $deadline) {
            try {
              $token = (Invoke-RestMethod "$base/api/auth/login" -Method Post -ContentType 'application/json' `
                -Body '{"username":"admin","password":"admin"}' -TimeoutSec 10).access_token
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $token) { & $hostExe status; throw 'no login as admin/admin within 5 minutes' }
          "ok   login"
          $r = Invoke-WebRequest "$base/api/auth/change-password" -Method Post -ContentType 'application/json' `
            -Headers @{ Authorization = "Bearer $token" } -SkipHttpErrorCheck `
            -Body '{"currentPassword":"admin","newPassword":"smoke-test-password"}'
          if ($r.StatusCode -ne 200) { throw "change-password answered $($r.StatusCode): $($r.Content)" }
          $token = ($r.Content | ConvertFrom-Json).access_token
          "ok   password changed"

          $mtAdmin = Invoke-RestMethod "http://localhost:$(& $hostExe env MT_ADMIN_PORT)/api/config"
          if (-not $mtAdmin.standalone) { throw "mt_admin is not in standalone mode: $($mtAdmin | ConvertTo-Json -Compress)" }
          "ok   mt_admin, realm $($mtAdmin.realm)"

          $anonymous = Invoke-WebRequest "$base/api/recording-profiles" -SkipHttpErrorCheck
          if ($anonymous.StatusCode -ne 401) { throw "without a token /api/recording-profiles answered $($anonymous.StatusCode), not 401" }
          "ok   anonymous call refused"

          $paths = '/', '/api/recording-profiles', '/api/media-mtx/servers', '/api/entitystate'
          $pending = [Collections.Generic.List[string]]::new([string[]] $paths)
          while ($pending.Count -gt 0 -and (Get-Date) -lt $deadline) {
            foreach ($path in @($pending)) {
              try {
                $r = Invoke-WebRequest "$base$path" -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 10 -SkipHttpErrorCheck
                if ($r.StatusCode -eq 200) { "ok   $path"; $pending.Remove($path) | Out-Null }
              } catch { }
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 5 }
          }
          & $hostExe status
          if ($pending.Count -gt 0) { throw "no 200 within 5 minutes from: $($pending -join ', ')" }
          $restarted = & $hostExe status | Where-Object { $_ -notmatch 'restarts 0' }
          if ($restarted) { "::warning::restarted while coming up:`n$($restarted -join "`n")" }
          # One machine runs neither of what a deployment over several needs.
          if (& $hostExe status | Select-String 'consul|sentry') { throw 'a standalone installation runs Consul or Sentry' }
          "ok   standalone: no Consul, no Sentry"

      - name: Uninstall
        timeout-minutes: 10
        run: |
          $u = Start-Process "$env:RUNNER_TEMP\out\ta_vms-setup-x64.exe" -PassThru `
            -ArgumentList '/uninstall', '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\uninstall.log"
          $null = $u.Handle
          $u.WaitForExit()
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          $left = Get-Service TaVmsHost, TaVms.Postgres, TaVms.RabbitMQ -ErrorAction SilentlyContinue
          if ($left) { throw "services left behind: $($left.Name -join ', ')" }
          if (Test-Path 'C:\Program Files\TreeAlarm VMS') {
            Get-ChildItem 'C:\Program Files\TreeAlarm VMS' -Recurse -Force | Select-Object -First 20 FullName
            throw 'the installation directory is still there'
          }
          if (-not (Test-Path 'C:\ProgramData\TreeAlarm\VMS\config\site.env')) { throw 'uninstall removed the data directory' }

      - name: Collect logs
        if: ${{ always() }}
        run: |
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'logs')
          # setup.log, and beside it the log of each package the bundle ran (setup_000_*.log ...).
          Copy-Item "$env:RUNNER_TEMP\*.log" $out -ErrorAction SilentlyContinue
          foreach ($d in 'install-logs', 'host-logs', 'logs') {
            $src = "C:\ProgramData\TreeAlarm\VMS\$d"
            if (Test-Path $src) { Copy-Item $src (Join-Path $out $d) -Recurse }
          }
          exit 0

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: ta_vms-setup-x64
          path: |
            ${{ runner.temp }}/out/ta_vms-setup-x64.exe
            ${{ runner.temp }}/out/ta_vms-x64.msi
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # What a user does: the latest release installed, then this build run over it. The data has to
  # survive (site.env, the database, Keycloak's realm), and the result must look like a fresh
  # install of this version. The release before 0.1.6 was an Inno Setup installer, which this build
  # removes on its own.
  upgrade:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ta_vms-setup-x64
          path: ${{ runner.temp }}/new

      - name: Install the latest release
        timeout-minutes: 20
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName
          if ($LASTEXITCODE -ne 0) { throw 'no release to upgrade from' }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern ta_vms-setup-x64.exe --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE -ne 0) { throw "cannot download the installer of $tag" }
          $old = "$env:RUNNER_TEMP\old\ta_vms-setup-x64.exe"
          # Inno Setup signs its work in the version resource; a WiX bundle does not.
          $inno = (Get-Item $old).VersionInfo.Comments -match 'Inno Setup'
          "installing $tag ($(if ($inno) { 'Inno Setup' } else { 'WiX' }))"
          $arguments = if ($inno) { '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\old-setup.log" }
                       else { '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\old-setup.log" }
          $setup = Start-Process $old -PassThru -ArgumentList $arguments
          $null = $setup.Handle
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "$tag setup exited with $($setup.ExitCode)" }
          (Get-FileHash 'C:\ProgramData\TreeAlarm\VMS\config\site.env').Hash | Set-Content "$env:RUNNER_TEMP\site.env.hash"

      - name: Upgrade
        timeout-minutes: 20
        run: |
          $setup = Start-Process "$env:RUNNER_TEMP\new\ta_vms-setup-x64.exe" -PassThru `
            -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\setup.log"
          $null = $setup.Handle
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "the upgrade exited with $($setup.ExitCode)" }

          $services = Get-Service TaVmsHost, TaVms.Postgres, TaVms.RabbitMQ
          $services | Format-Table Name, Status
          if ($services | Where-Object Status -ne 'Running') { throw 'a service is not running after the upgrade' }
          if ((Get-FileHash 'C:\ProgramData\TreeAlarm\VMS\config\site.env').Hash -ne (Get-Content "$env:RUNNER_TEMP\site.env.hash")) {
            throw 'the upgrade rewrote site.env'
          }
          $uninstall = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          if (Test-Path "$uninstall\{6C2E9B0E-4B7A-4F51-9E0B-7A1C3D5F2E84}_is1") { throw 'the Inno Setup installation is still registered' }
          if (Test-Path 'C:\Program Files\TreeAlarm VMS\unins000.exe') { throw "Inno Setup's uninstaller was left behind" }
          $entries = @(Get-ItemProperty "$uninstall\*", 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'TreeAlarm VMS' -and -not $_.SystemComponent })
          if ($entries.Count -ne 1) { throw "$($entries.Count) visible 'TreeAlarm VMS' entries in Apps and Features, not 1" }
          "ok   upgraded to $($entries[0].DisplayVersion), site.env kept"

          # Keycloak's database survived: the realm is there, and admin still has its first password.
          $hostExe = 'C:\Program Files\TreeAlarm VMS\host\TaVmsHost.exe'
          $base = "http://localhost:$(& $hostExe env WEB_VMS_PORT)"
          $deadline = (Get-Date).AddMinutes(5)
          $token = $null
          while (-not $token -and (Get-Date) -lt $deadline) {
            try {
              $token = (Invoke-RestMethod "$base/api/auth/login" -Method Post -ContentType 'application/json' `
                -Body '{"username":"admin","password":"admin"}' -TimeoutSec 10).access_token
            } catch { Start-Sleep -Seconds 5 }
          }
          & $hostExe status
          if (-not $token) { throw 'no login as admin/admin within 5 minutes of the upgrade' }
          "ok   login after the upgrade"

      - name: Collect logs
        if: ${{ always() }}
        run: |
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'logs')
          Copy-Item "$env:RUNNER_TEMP\*.log" $out -ErrorAction SilentlyContinue
          foreach ($d in 'install-logs', 'host-logs', 'logs') {
            $src = "C:\ProgramData\TreeAlarm\VMS\$d"
            if (Test-Path $src) { Copy-Item $src (Join-Path $out $d) -Recurse }
          }
          exit 0

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: upgrade-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

  # A core of a deployment over several machines, on one runner: Consul's server, Sentry and
  # placement with TLS, every sidecar resolving through Consul with a certificate Sentry signed.
  # The calls below cross sidecars as in the smoke test, so a 200 means all of that works. A node
  # cannot be tried here (it would need a second machine); its package is made, at least.
  core:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ta_vms-setup-x64
          path: ${{ runner.temp }}/new

      - name: Install as the core
        timeout-minutes: 20
        run: |
          $address = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.PrefixOrigin -in 'Dhcp', 'Manual' -and $_.IPAddress -notlike '169.254.*' } |
            Select-Object -First 1).IPAddress
          if (-not $address) { throw 'no IPv4 address on the runner' }
          "core at $address"
          $setup = Start-Process "$env:RUNNER_TEMP\new\ta_vms-setup-x64.exe" -PassThru `
            -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\setup.log", 'Role=core', "Address=$address"
          $null = $setup.Handle
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }

      - name: Check the core
        timeout-minutes: 10
        run: |
          $hostExe = 'C:\Program Files\TreeAlarm VMS\host\TaVmsHost.exe'
          if ((& $hostExe env TAVMS_ROLE) -ne 'core') { throw 'the installation is not a core' }
          $base = "http://localhost:$(& $hostExe env WEB_VMS_PORT)"
          $deadline = (Get-Date).AddMinutes(5)
          $token = $null
          while (-not $token -and (Get-Date) -lt $deadline) {
            try {
              $token = (Invoke-RestMethod "$base/api/auth/login" -Method Post -ContentType 'application/json' `
                -Body '{"username":"admin","password":"admin"}' -TimeoutSec 10).access_token
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $token) { & $hostExe status; throw 'no login as admin/admin within 5 minutes' }
          $pending = [Collections.Generic.List[string]]::new([string[]] @('/api/recording-profiles', '/api/media-mtx/servers', '/api/entitystate'))
          while ($pending.Count -gt 0 -and (Get-Date) -lt $deadline) {
            foreach ($path in @($pending)) {
              try {
                $r = Invoke-WebRequest "$base$path" -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 10 -SkipHttpErrorCheck
                if ($r.StatusCode -eq 200) { "ok   $path"; $pending.Remove($path) | Out-Null }
              } catch { }
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 5 }
          }
          $status = & $hostExe status
          $status
          if ($pending.Count -gt 0) { throw "no 200 within 5 minutes from: $($pending -join ', ')" }
          # They depend on nothing but the machine, so a restart is a fault that only looks healed
          # (Consul's wal log store did that: it died twice on Windows, then ran).
          foreach ($name in 'consul-server', 'sentry', 'placement') {
            $line = $status | Select-String "^\s*$name\b"
            if (-not $line) { throw "the core does not run $name" }
            if ($line -notmatch '\brestarts 0\b') { throw "$name restarted: $line" }
          }
          # Every sidecar registered itself with Consul and passes its health check.
          $health = Invoke-RestMethod 'http://127.0.0.1:8500/v1/health/state/any'
          $health | Format-Table ServiceName, Status
          $bad = @($health | Where-Object { $_.ServiceName -and $_.Status -ne 'passing' })
          if ($bad.Count -gt 0) { throw "unhealthy in Consul: $($bad.ServiceName -join ', ')" }
          if (@($health | Where-Object ServiceName).Count -lt 11) { throw 'not every sidecar is registered in Consul' }
          "ok   11 sidecars healthy in Consul"
          # Nothing of it on the LAN but what the firewall lets in: the sidecars' API stays local.
          $address = & $hostExe env DAPR_HOST_IP
          $client = New-Object Net.Sockets.TcpClient
          try { $client.Connect($address, 3600); throw "web-vms's sidecar API answers on $address" } catch [Net.Sockets.SocketException] { "ok   sidecar API not on $address" } finally { $client.Dispose() }

          & $hostExe package ci
          if ($LASTEXITCODE -ne 0) { throw 'TaVmsHost package failed' }
          $package = 'C:\ProgramData\TreeAlarm\VMS\distributed\node-ci.tar.gz'
          $listing = tar -tzf $package
          $listing
          foreach ($entry in 'shared.env', 'core.env', 'nodes', 'name', 'tokens/vms-ci.token') {
            if (-not ($listing -contains $entry)) { throw "the package has no $entry" }
          }
          "ok   node package"

      - name: Collect logs
        if: ${{ always() }}
        run: |
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'logs')
          Copy-Item "$env:RUNNER_TEMP\*.log" $out -ErrorAction SilentlyContinue
          foreach ($d in 'install-logs', 'host-logs', 'logs') {
            $src = "C:\ProgramData\TreeAlarm\VMS\$d"
            if (Test-Path $src) { Copy-Item $src (Join-Path $out $d) -Recurse }
          }
          exit 0

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: core-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

  release:
    needs: [installer, upgrade, core]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TA_VMS_COMMIT: ${{ needs.installer.outputs.ta_vms_commit }}
      MT_ADMIN_COMMIT: ${{ needs.installer.outputs.mt_admin_commit }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: ta_vms-setup-x64
          path: dist

      # What `docker compose up` reads from this directory, and nothing of the Windows installer.
      - name: Compose stack
        run: |
          git archive --format=zip --prefix=ta_vms/ -o dist/ta_vms-docker.zip HEAD \
            README.md LICENSE .env docker-compose.yml docker-compose.gpu.yml.example init_files scripts/prepare-databases.sh

      # A quoted heredoc, so the backticks and backslashes stay as written; envsubst fills in only
      # the variables it is told about.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}" TAG="$GITHUB_REF_NAME" SHORT_COMMIT="${TA_VMS_COMMIT::7}" SHORT_MT_ADMIN="${MT_ADMIN_COMMIT::7}"
          envsubst '$TAG $TA_VMS_COMMIT $SHORT_COMMIT $MT_ADMIN_COMMIT $SHORT_MT_ADMIN' > "$RUNNER_TEMP/notes.md" <<'EOF'
          **TreeAlarm VMS is a video management system you run yourself.** It records, stores and plays back video from IP cameras over ONVIF and RTSP, streams live video to the browser over WebRTC, and runs on your own hardware with no cloud account. See the [ta_vms README](https://github.com/treealarm/ta_vms#readme).

          ### Downloads
          - **ta_vms-setup-x64.exe**: Windows installer, no Docker needed (Windows 10 1809 / Server 2019 or later, x64). Installs PostgreSQL, RabbitMQ, MediaMTX, Dapr and every service as native Windows services. It leaves out the analytics worker, ROI re-compression and hardware encoding; see [windows/README.md](https://github.com/treealarm/ta_install/blob/$TAG/windows/README.md). The installer is not code-signed yet, so SmartScreen asks before running it (More info, Run anyway). Unattended: `ta_vms-setup-x64.exe /quiet /norestart StorageFolder=D:\TreeAlarm`.
          - **ta_vms-x64.msi**: the same installation as a bare MSI, for Group Policy or Intune, on machines that already have the VC++, .NET 10 and ASP.NET Core 10 runtimes (setup.exe installs those itself).
          - **ta_vms-docker.zip**: the Docker Compose stack for Linux, with the analytics worker. Unzip, then `cd ta_vms && docker compose --env-file .env up -d`. It pulls the `treealarm/*:latest` images from Docker Hub, so it always runs the newest build; its README lists the defaults to replace before a real deployment.

          The web interface opens on port 5134; the first sign-in is admin / admin, and the password can be changed in the web interface. Users are added on port 8013. Uninstalling, or `docker compose down`, keeps the data: `C:\ProgramData\TreeAlarm\VMS` on Windows, `./data` beside the compose file.

          The Windows installer is built from ta_vms [`$SHORT_COMMIT`](https://github.com/treealarm/ta_vms/commit/$TA_VMS_COMMIT) and multitenant_admin [`$SHORT_MT_ADMIN`](https://github.com/treealarm/multitenant_admin/commit/$MT_ADMIN_COMMIT).
          EOF
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/ta_vms-setup-x64.exe dist/ta_vms-x64.msi dist/ta_vms-docker.zip \
            --verify-tag --title "TreeAlarm VMS $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
