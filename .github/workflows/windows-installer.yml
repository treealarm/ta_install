# Builds the Windows installer (windows/installer/ta_vms.iss) and proves it on a clean runner:
# a silent install, the stack answering through its sidecars, an uninstall.
#
# Its input is the ta_vms Windows build, the asset ta_vms-windows-x64.zip of the windows-build
# prerelease in treealarm/ta_vms, which every push to ta_vms master replaces -- the way the compose
# stack here runs whatever Docker Hub's :latest is. A new ta_vms build does not trigger this
# workflow: run it by hand (Actions page, or `gh workflow run windows-installer.yml`).
#
# A vX.Y.Z tag also publishes the GitHub release of that version: this installer, once it has
# passed the checks below, and the compose stack as a zip. The compose files in the zip are frozen at
# the version, the images they run are not: Docker Hub's :latest, as everywhere else here.

name: windows-installer

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters do not apply to tag pushes
    paths:
      - windows/**
      - .env
      - init_files/config/mediamtx.yml
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TA_VMS_REPO: treealarm/ta_vms
  TA_VMS_RELEASE: windows-build
  TA_VMS_ASSET: ta_vms-windows-x64.zip
  MT_ADMIN_REPO: treealarm/multitenant_admin
  MT_ADMIN_ASSET: mt_admin-windows-x64.zip
  GH_TOKEN: ${{ github.token }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      ta_vms_commit: ${{ steps.download.outputs.commit }}
      mt_admin_commit: ${{ steps.download.outputs.mt_admin_commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test TaVmsHost
        run: dotnet test windows/TaVmsHost.Tests -c Release --nologo

      - name: Download the ta_vms build
        id: download
        run: |
          gh release download $env:TA_VMS_RELEASE --repo $env:TA_VMS_REPO --pattern $env:TA_VMS_ASSET --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "cannot download $env:TA_VMS_ASSET from $env:TA_VMS_REPO" }
          $notes = gh release view $env:TA_VMS_RELEASE --repo $env:TA_VMS_REPO --json body -q .body
          $notes
          if (-not ("$notes" -match '\b[0-9a-f]{40}\b')) { throw "no commit in the notes of $env:TA_VMS_RELEASE" }
          "commit=$($Matches[0])" >> $env:GITHUB_OUTPUT

          gh release download windows-build --repo $env:MT_ADMIN_REPO --pattern $env:MT_ADMIN_ASSET --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "cannot download $env:MT_ADMIN_ASSET from $env:MT_ADMIN_REPO" }
          $notes = gh release view windows-build --repo $env:MT_ADMIN_REPO --json body -q .body
          if (-not ("$notes" -match '\b[0-9a-f]{40}\b')) { throw "no commit in the notes of $env:MT_ADMIN_REPO windows-build" }
          "mt_admin_commit=$($Matches[0])" >> $env:GITHUB_OUTPUT

      # Third-party downloads are keyed by versions.json: they change only when it does.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/downloads
          key: windows-deps-${{ hashFiles('windows/versions.json') }}

      - name: Stage
        run: |
          .\windows\scripts\Build-Stage.ps1 `
            -TaVmsZip (Join-Path $env:RUNNER_TEMP $env:TA_VMS_ASSET) `
            -MtAdminZip (Join-Path $env:RUNNER_TEMP $env:MT_ADMIN_ASSET) `
            -Stage (Join-Path $env:RUNNER_TEMP 'stage') `
            -Cache (Join-Path $env:RUNNER_TEMP 'downloads')

      - name: Build setup.exe
        run: |
          $version = "0.0.0.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$env:GITHUB_REF_NAME' is not vX.Y.Z" }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'cannot install Inno Setup' }
          }
          & $iscc /Q "/DStageDir=$env:RUNNER_TEMP\stage" "/DAppVersion=$version" `
            "/DOutputDir=$env:RUNNER_TEMP\out" windows\installer\ta_vms.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Get-Item "$env:RUNNER_TEMP\out\ta_vms-setup-x64.exe" | Format-List Name, Length

      # Waits for setup.exe itself, not with -Wait: in PowerShell 7 that waits for every descendant,
      # and installing RabbitMQ leaves epmd.exe running for good. (The uninstall below is the
      # opposite case: unins000.exe hands over to a copy of itself and exits, so there -Wait is
      # what waits for the uninstall to finish.)
      - name: Install
        timeout-minutes: 20
        run: |
          $setup = Start-Process "$env:RUNNER_TEMP\out\ta_vms-setup-x64.exe" -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log"
          $null = $setup.Handle # keeps the exit code readable after the process is gone
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          Get-Service TaVmsHost, TaVms.Postgres, TaVms.RabbitMQ | Format-Table Name, Status, StartType

      # Each of these goes browser -> web_srv -> its sidecar -> another app's sidecar -> the app
      # (-> PostgreSQL), so a 200 means name resolution, the components and the databases all work.
      # They need a login first, which proves Keycloak came up with its realm: the initial
      # admin/admin, made to set a new password, as a person would on the first visit.
      - name: Smoke test
        timeout-minutes: 10
        run: |
          $hostExe = 'C:\Program Files\TreeAlarm VMS\host\TaVmsHost.exe'
          $base = "http://localhost:$(& $hostExe env WEB_VMS_PORT)"
          $deadline = (Get-Date).AddMinutes(5)

          function Get-Roles([string] $jwt) {
            $body = $jwt.Split('.')[1].Replace('-', '+').Replace('_', '/')
            $body += '=' * ((4 - $body.Length % 4) % 4)
            ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($body)) | ConvertFrom-Json).realm_access.roles
          }

          $token = $null
          while (-not $token -and (Get-Date) -lt $deadline) {
            try {
              $token = (Invoke-RestMethod "$base/api/auth/login" -Method Post -ContentType 'application/json' `
                -Body '{"username":"admin","password":"admin"}' -TimeoutSec 10).access_token
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $token) { & $hostExe status; throw 'no login as admin/admin within 5 minutes' }
          "ok   login"
          if ((Get-Roles $token) -contains 'password-change-required') {
            $r = Invoke-WebRequest "$base/api/auth/change-password" -Method Post -ContentType 'application/json' `
              -Headers @{ Authorization = "Bearer $token" } -SkipHttpErrorCheck `
              -Body '{"currentPassword":"admin","newPassword":"smoke-test-password"}'
            # A ta_vms build from before the change-password endpoint answers 405 (the SPA fallback
            # takes GET only) or 404, and the role means nothing to it.
            if ($r.StatusCode -eq 200) {
              $token = ($r.Content | ConvertFrom-Json).access_token
              if ((Get-Roles $token) -contains 'password-change-required') { throw 'the new token still demands a password change' }
              "ok   password changed"
            } elseif ($r.StatusCode -notin 404, 405) { throw "change-password answered $($r.StatusCode): $($r.Content)" }
          }

          $anonymous = Invoke-WebRequest "$base/api/recording-profiles" -SkipHttpErrorCheck
          if ($anonymous.StatusCode -ne 401) { throw "without a token /api/recording-profiles answered $($anonymous.StatusCode), not 401" }
          "ok   anonymous call refused"

          $paths = '/', '/api/recording-profiles', '/api/media-mtx/servers', '/api/entitystate'
          $pending = [Collections.Generic.List[string]]::new([string[]] $paths)
          while ($pending.Count -gt 0 -and (Get-Date) -lt $deadline) {
            foreach ($path in @($pending)) {
              try {
                $r = Invoke-WebRequest "$base$path" -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 10 -SkipHttpErrorCheck
                if ($r.StatusCode -eq 200) { "ok   $path"; $pending.Remove($path) | Out-Null }
              } catch { }
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 5 }
          }
          & $hostExe status
          if ($pending.Count -gt 0) { throw "no 200 within 5 minutes from: $($pending -join ', ')" }
          $restarted = & $hostExe status | Where-Object { $_ -notmatch 'restarts 0' }
          if ($restarted) { "::warning::restarted while coming up:`n$($restarted -join "`n")" }

      - name: Uninstall
        timeout-minutes: 10
        run: |
          $u = Start-Process 'C:\Program Files\TreeAlarm VMS\unins000.exe' -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          $left = Get-Service TaVmsHost, TaVms.Postgres, TaVms.RabbitMQ -ErrorAction SilentlyContinue
          if ($left) { throw "services left behind: $($left.Name -join ', ')" }
          if (-not (Test-Path 'C:\ProgramData\TreeAlarm\VMS\config\site.env')) { throw 'uninstall removed the data directory' }

      - name: Collect logs
        if: ${{ always() }}
        run: |
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'logs')
          Copy-Item "$env:RUNNER_TEMP\setup.log" $out -ErrorAction SilentlyContinue
          foreach ($d in 'install-logs', 'host-logs', 'logs') {
            $src = "C:\ProgramData\TreeAlarm\VMS\$d"
            if (Test-Path $src) { Copy-Item $src (Join-Path $out $d) -Recurse }
          }
          exit 0

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: ta_vms-setup-x64
          path: ${{ runner.temp }}/out/ta_vms-setup-x64.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TA_VMS_COMMIT: ${{ needs.installer.outputs.ta_vms_commit }}
      MT_ADMIN_COMMIT: ${{ needs.installer.outputs.mt_admin_commit }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: ta_vms-setup-x64
          path: dist

      # What `docker compose up` reads from this directory, and nothing of the Windows installer.
      - name: Compose stack
        run: |
          git archive --format=zip --prefix=ta_vms/ -o dist/ta_vms-docker.zip HEAD \
            README.md LICENSE .env docker-compose.yml docker-compose.gpu.yml.example init_files scripts/prepare-databases.sh

      # A quoted heredoc, so the backticks and backslashes stay as written; envsubst fills in only
      # the variables it is told about.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}" TAG="$GITHUB_REF_NAME" SHORT_COMMIT="${TA_VMS_COMMIT::7}" SHORT_MT_ADMIN="${MT_ADMIN_COMMIT::7}"
          envsubst '$TAG $TA_VMS_COMMIT $SHORT_COMMIT $MT_ADMIN_COMMIT $SHORT_MT_ADMIN' > "$RUNNER_TEMP/notes.md" <<'EOF'
          **TreeAlarm VMS is a video management system you run yourself.** It records, stores and plays back video from IP cameras over ONVIF and RTSP, streams live video to the browser over WebRTC, and runs on your own hardware with no cloud account. See the [ta_vms README](https://github.com/treealarm/ta_vms#readme).

          ### Downloads
          - **ta_vms-setup-x64.exe**: Windows installer, no Docker needed (Windows 10 1809 / Server 2019 or later, x64). Installs PostgreSQL, RabbitMQ, MediaMTX, Dapr and every service as native Windows services. It leaves out the analytics worker, ROI re-compression and hardware encoding; see [windows/README.md](https://github.com/treealarm/ta_install/blob/$TAG/windows/README.md). The installer is not code-signed yet, so SmartScreen asks before running it (More info, Run anyway).
          - **ta_vms-docker.zip**: the Docker Compose stack for Linux, with the analytics worker. Unzip, then `cd ta_vms && docker compose --env-file .env up -d`. It pulls the `treealarm/*:latest` images from Docker Hub, so it always runs the newest build; its README lists the defaults to replace before a real deployment.

          The web interface opens on port 5134; the first sign-in is admin / admin, which then has to set a new password. Users are added on port 8013. Uninstalling, or `docker compose down`, keeps the data: `C:\ProgramData\TreeAlarm\VMS` on Windows, `./data` beside the compose file.

          The Windows installer is built from ta_vms [`$SHORT_COMMIT`](https://github.com/treealarm/ta_vms/commit/$TA_VMS_COMMIT) and multitenant_admin [`$SHORT_MT_ADMIN`](https://github.com/treealarm/multitenant_admin/commit/$MT_ADMIN_COMMIT).
          EOF
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/ta_vms-setup-x64.exe dist/ta_vms-docker.zip \
            --verify-tag --title "TreeAlarm VMS $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
