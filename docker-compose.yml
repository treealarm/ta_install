# Standalone product deployment: own broker, own (default, isolated) docker network, no
# `profiles:` gating — every service starts on a plain `docker compose up`, independent of
# Square/multitenant_admin. Pulls prebuilt `treealarm/...` images published by
# scripts/push-images.sh (built by scripts/build-images.sh from sibling ta_vms / video_a
# checkouts). Square integration stays off by default (KEYCLOAK_URL,
# SQUARE_INTEGRATION_SINK_APP_ID empty in .env) per ta_vms CLAUDE.md's env-gating rule.
x-data-volume: &data-volume
  - ./data:/data

services:
  # Actor placement. Reached by service name over the compose network, not through a published
  # host port: publishing 50005 collides with a `dapr init` placement on the deployment host.
  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # No docker-entrypoint-initdb.d mount: that hook fires only when the data directory is
    # initialised from empty, so on every installation past the first — which is every
    # installation that has ever recorded anything — a database added later would never be
    # created, silently. The db-init service below is the single thing that creates them, on
    # every start, and it reads their names from .env instead of a hardcoded list.
    volumes:
      - ./data/postgres:/var/lib/postgresql

  # Creates the service databases (see the comment on postgres above) and cross-checks the Dapr
  # components against .env. Runs to completion and exits; idempotent, so repeating it on every
  # `docker compose up` costs nothing. Can also be run on its own:
  #   docker compose run --rm db-init            # create what is missing
  #   docker compose run --rm db-init --check    # report only, create nothing
  db-init:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - ./scripts:/init:ro
      # Read-only, and only to compare: the state store's connection string is a literal (Dapr
      # does not expand environment variables in component metadata), so it is the one place
      # where the database name and credentials are duplicated. Changing POSTGRES_PASSWORD in
      # .env alone would otherwise surface as a state store that quietly never worked.
      - ./init_files/dapr_components:/components:ro
    # Invoked through bash rather than executed directly: the exec bit does not survive a bind
    # mount from a Windows host.
    entrypoint: ["bash", "/init/prepare-databases.sh"]
    working_dir: /init
    restart: "no"
    depends_on:
      - postgres

  # The Dapr pub/sub broker, in place of the redis that used to sit here. The state store already
  # moved to the postgres above, so redis was left carrying only the bus — and it is the one
  # broker with no native Windows build, which blocks the Docker-free installer that comes after
  # Kubernetes on the roadmap. RabbitMQ serves all three the same way, and the bus semantics are
  # unchanged: one durable queue per app id per topic, see init_files/dapr_components/orderpubsub.yaml.
  rabbitmq:
    image: rabbitmq:management
    environment:
      # The built-in "guest" account is refused from anywhere but localhost, so no sidecar in a
      # container could use it. These must match the credentials in the orderpubsub component.
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-vms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-vms}"
    ports:
      # Management UI only, and only on the loopback interface: it is an operator tool for looking
      # at queues, not something to expose on a customer network. The AMQP port stays unpublished —
      # every client is inside the compose network.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # Queues are durable and hold events across a subscriber restart; without a volume they
      # would come back empty on every start.
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  mediamtx:
    image: bluenviron/mediamtx:latest
    # Passwords for the vms_publish / vms_read accounts declared in mediamtx.yml. MediaMTX merges
    # these into the yml entries by index, so the file keeps the users and permissions while the
    # secrets stay in .env. Both ports below now require one of those accounts.
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${VMS_MEDIAMTX_PUBLISH_PASS}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${VMS_MEDIAMTX_READ_PASS}"
    ports:
      - "8889:8889"       # WHEP signaling — only the web_vms gateway should use it
      - "8554:8554"       # RTSP
      - "8189:8189/udp"  # ICE/UDP media, goes straight to the browser
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmssingleton:
    image: treealarm/vmssingleton:latest
    env_file:
      - .env
    environment:
      APP_ID: vmssingleton
    # Exactly one instance, always — see CLAUDE.md. It runs work that must not happen twice and
    # aggregates pub/sub reports in memory, which a second replica would split rather than share.
    volumes: *data-volume
    # Waits for the infrastructure even though this service owns no database: its Dapr sidecar
    # loads every component in /components — state store and pub/sub alike — and daprd exits when
    # a component fails to initialise (spec.ignoreErrors is false by default), without retrying.
    # Started before the state database exists or before the broker accepts connections, the
    # sidecar would simply die. Sidecars inherit this wait through their depends_on on the app,
    # so the rule is: every app service waits for db-init and rabbitmq, directly or through
    # another service that does.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmssingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssingleton"
      - "-app-port"
      - "${SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmssingleton"
    depends_on:
      - vmssingleton

  vmssquaresingleton:
    image: treealarm/vmssquaresingleton:latest
    env_file:
      - .env
    environment:
      APP_ID: vmssquaresingleton
    # Exactly one instance: its startup resync pushes every camera into Square, and a second copy
    # would push the whole tree again. See CLAUDE.md.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmssquaresingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssquaresingleton"
      - "-app-port"
      - "${SQUARE_SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmssquaresingleton"
    depends_on:
      - vmssquaresingleton

  vmsutils:
    image: treealarm/vmsutils:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume
    # For its sidecar's state store component, not for itself — see vmssingleton above.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmsutils-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils

  vmslogger:
    image: treealarm/vmslogger:latest
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume
    # For its sidecar's state store component, not for itself — see vmssingleton above.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmslogger-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger

  vmscfg:
    image: treealarm/vmscfg:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    # Waits for db-init to finish, not just for postgres to be up: without its database this
    # service now fails fast with a message naming it instead of retrying forever, so starting
    # it early would turn a working installation into a crash loop.
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmscfg-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "${CFG_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg

  vmsonvif:
    image: treealarm/vmsonvif:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "${ONVIF_SRV_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif

  vmsonvif-actors:
    image: treealarm/vmsonvif-actors:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "${ONVIF_ACTORS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "dapr-placement:50005"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vmsfs:
    image: treealarm/vmsfs:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    # See vmscfg: waits for the database to exist, not merely for the server to be up.
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmsfs-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs

  vmsanalyticssingleton:
    image: treealarm/vmsanalyticssingleton:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsanalyticssingleton
    volumes: *data-volume
    # See vmscfg: waits for the database to exist, not merely for the server to be up.
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      vmscfg:
        condition: service_started

  vmsanalyticssingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsanalyticssingleton"
      - "-app-port"
      - "${ANALYTICS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsanalyticssingleton"
    depends_on:
      - vmsanalyticssingleton

  # video_a analytics worker — stateless RTSP/OpenVINO engine: crops travel in the detection
  # events and are persisted by vmsanalyticssingleton onto the shared data volume. Models are baked into
  # the image (see video_a/Dockerfile), no volume needed.
  analytics-worker:
    image: treealarm/analytics-worker:latest
    environment:
      ANALYTICS_GRPC_PORT: "50060"
      ANALYTICS_DEVICE: CPU
      ANALYTICS_REID_EMBED_INTERVAL_SEC: "${ANALYTICS_REID_EMBED_INTERVAL_SEC}"
      ANALYTICS_STUB_SYNTHETIC_DETECTIONS: "false"
    # For its sidecar's state store component, not for itself — see vmssingleton above.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  analytics-worker-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "analytics-worker"
      - "-app-port"
      - "50060"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:analytics-worker"
    depends_on:
      - analytics-worker

  vms:
    image: treealarm/vms:latest
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    volumes: *data-volume
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx

  roitrc:
    image: treealarm/roitrc:latest
    env_file:
      - .env
    environment:
      APP_ID: roitrc
    # The only service that touches the GPU. Without the device it still runs --
    # the encoder falls back to libx264 -- just far slower. `render` owns
    # /dev/dri/renderD128 on the host; drop both keys on a host without an
    # Intel GPU.
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "render"
    volumes: *data-volume
    depends_on:
      - vmscfg

  roitrc-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "roitrc"
      - "-app-port"
      - "${GRPC_ROI_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:roitrc"
    depends_on:
      - roitrc

  vms-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "${GRPC_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vms"
    depends_on:
      - vms

  web_vms:
    image: treealarm/web_vms:latest
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    env_file:
      - .env
    depends_on:
      - vms
      - vmscfg
      - vmsfs

  web_vms-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:web_vms"
    depends_on:
      - web_vms
