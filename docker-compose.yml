# Standalone product deployment: own `redis`, own (default, isolated) docker network, no
# `profiles:` gating — every service starts on a plain `docker compose up`, independent of
# Square/multitenant_admin. Pulls prebuilt `treealarm/...` images published by
# scripts/push-images.sh (built by scripts/build-images.sh from sibling ta_vms / video_a
# checkouts). Square integration stays off by default (KEYCLOAK_URL,
# SQUARE_INTEGRATION_SINK_APP_ID empty in .env) per ta_vms CLAUDE.md's env-gating rule.
x-data-volume: &data-volume
  - ./data:/data

services:
  # Actor placement. Reached by service name over the compose network, not through a published
  # host port: publishing 50005 collides with a `dapr init` placement on the deployment host.
  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init_files/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:latest

  mediamtx:
    image: bluenviron/mediamtx:latest
    # Passwords for the vms_publish / vms_read accounts declared in mediamtx.yml. MediaMTX merges
    # these into the yml entries by index, so the file keeps the users and permissions while the
    # secrets stay in .env. Both ports below now require one of those accounts.
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${VMS_MEDIAMTX_PUBLISH_PASS}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${VMS_MEDIAMTX_READ_PASS}"
    ports:
      - "8889:8889"       # WHEP signaling — only the web_vms gateway should use it
      - "8554:8554"       # RTSP
      - "8189:8189/udp"  # ICE/UDP media, goes straight to the browser
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmssingleton:
    image: treealarm/vmssingleton:latest
    env_file:
      - .env
    environment:
      APP_ID: vmssingleton
    # Exactly one instance, always — see CLAUDE.md. It runs work that must not happen twice and
    # aggregates pub/sub reports in memory, which a second replica would split rather than share.
    volumes: *data-volume

  vmssingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssingleton"
      - "-app-port"
      - "${SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmssingleton"
    depends_on:
      - vmssingleton
      - redis

  vmssquaresingleton:
    image: treealarm/vmssquaresingleton:latest
    env_file:
      - .env
    environment:
      APP_ID: vmssquaresingleton
    # Exactly one instance: its startup resync pushes every camera into Square, and a second copy
    # would push the whole tree again. See CLAUDE.md.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmssquaresingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssquaresingleton"
      - "-app-port"
      - "${SQUARE_SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmssquaresingleton"
    depends_on:
      - vmssquaresingleton
      - redis

  vmsutils:
    image: treealarm/vmsutils:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume

  vmsutils-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils
      - redis

  vmslogger:
    image: treealarm/vmslogger:latest
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume

  vmslogger-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger
      - redis

  vmscfg:
    image: treealarm/vmscfg:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    depends_on:
      - postgres

  vmscfg-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "${CFG_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg
      - redis

  vmsonvif:
    image: treealarm/vmsonvif:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "${ONVIF_SRV_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif
      - redis

  vmsonvif-actors:
    image: treealarm/vmsonvif-actors:latest
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "${ONVIF_ACTORS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "dapr-placement:50005"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vmsfs:
    image: treealarm/vmsfs:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    depends_on:
      - postgres

  vmsfs-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs
      - redis

  vmsanalyticssingleton:
    image: treealarm/vmsanalyticssingleton:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsanalyticssingleton
    volumes: *data-volume
    depends_on:
      - postgres
      - vmscfg

  vmsanalyticssingleton-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsanalyticssingleton"
      - "-app-port"
      - "${ANALYTICS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vmsanalyticssingleton"
    depends_on:
      - vmsanalyticssingleton
      - redis

  # video_a analytics worker — stateless RTSP/OpenVINO engine: crops travel in the detection
  # events and are persisted by vmsanalyticssingleton onto the shared data volume. Models are baked into
  # the image (see video_a/Dockerfile), no volume needed.
  analytics-worker:
    image: treealarm/analytics-worker:latest
    environment:
      ANALYTICS_GRPC_PORT: "50060"
      ANALYTICS_DEVICE: CPU
      ANALYTICS_REID_EMBED_INTERVAL_SEC: "${ANALYTICS_REID_EMBED_INTERVAL_SEC}"
      ANALYTICS_STUB_SYNTHETIC_DETECTIONS: "false"

  analytics-worker-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "analytics-worker"
      - "-app-port"
      - "50060"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:analytics-worker"
    depends_on:
      - analytics-worker

  vms:
    image: treealarm/vms:latest
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    volumes: *data-volume
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx

  vms-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "${GRPC_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:vms"
    depends_on:
      - vms
      - redis

  web_vms:
    image: treealarm/web_vms:latest
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    env_file:
      - .env
    depends_on:
      - vms
      - vmscfg
      - vmsfs

  web_vms-dapr:
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - ./init_files/dapr_components:/components
    network_mode: "service:web_vms"
    depends_on:
      - web_vms
      - redis
