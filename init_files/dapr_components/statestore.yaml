apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  # PostgreSQL, not the redis this used to be — the first of the two components to leave it, the
  # bus followed later (see orderpubsub.yaml, and there is no redis service here any more). State
  # here outlives a restart — ONVIF observed topics, the media server heartbeat, the
  # camera-permission version — while that redis was declared with no volume at all, so anything
  # left in it disappeared with the container. The same postgres that already holds the archive
  # metadata costs nothing extra and is backed up together with the rest of ./data.
  #
  # v1, not v2: v1 stores the value in a JSONB column. media_server writes its heartbeat as the
  # quoted string "online" straight from C++ (not through a Dapr SDK), which is valid JSON and so
  # survives; v2 stores values differently and has not been tested against that writer.
  type: state.postgresql
  version: v1
  metadata:
  # Literal, because Dapr does not expand environment variables in component metadata. That makes
  # this the one place where values from .env are written down twice: the database name must match
  # POSTGRES_STATE_DB (that variable is what makes db-init create it), and user/password must match
  # POSTGRES_USER/POSTGRES_PASSWORD. Change them here too when you change them in .env — db-init
  # compares the two copies and fails if they have drifted, so a mistake shows up as a startup
  # failure instead of as a state store that quietly never worked.
  - name: connectionString
    value: "host=postgres port=5432 user=postgres password=postgres database=ta_state sslmode=disable"
  # Required by vmsonvif-actors: without it the actor runtime refuses to start and every
  # ONVIF/PTZ call fails.
  - name: actorStateStore
    value: "true"
  # Dapr's default is keyPrefix=appid, which silently namespaces every key by the writer's app id:
  # VmsCfg would write "vmscfg||cam-perm-version" while web_vms read "web-vms||cam-perm-version",
  # and media_server's heartbeat ("vms||ms-status-<id>") never reached VmsCfg either. Several keys
  # here are deliberately shared between services, so the store is keyed by the component name
  # instead — one namespace per state store, not per app.
  - name: keyPrefix
    value: "name"
